<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 392" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Row 1: source control -->
  <rect x="12" y="12" width="128" height="48" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="76" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">Developer</text>
  <text x="76" y="49" text-anchor="middle" font-size="10.5" fill="#334155">git push · PR merge</text>

  <line x1="140" y1="36" x2="186" y2="36" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="188" y="12" width="232" height="48" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="304" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">GitHub</text>
  <text x="304" y="49" text-anchor="middle" font-size="10.5" fill="#334155">Aarpeet/calculator-devops · main + feature/*</text>

  <line x1="304" y1="60" x2="304" y2="98" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="312" y="80" font-size="10.5" fill="#334155">GitHub webhook (githubPush) · Poll SCM H/5 fallback</text>

  <rect x="604" y="12" width="244" height="48" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="726" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c0519">Jenkins credentials store</text>
  <text x="726" y="49" text-anchor="middle" font-size="10.5" fill="#334155">dockerhub-creds · gmail-smtp (masked)</text>

  <!-- Jenkins pipeline -->
  <rect x="12" y="100" width="836" height="112" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="24" y="118" font-size="12" font-weight="700" fill="#0f172a">Jenkins: declarative Jenkinsfile</text>
  <text x="232" y="118" font-size="10.5" fill="#475569">disableConcurrentBuilds · timestamps · timeout 30 min</text>

  <line x1="726" y1="60" x2="660" y2="128" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ad)"/>

  <g font-size="10.2" fill="#334155" text-anchor="middle">
    <rect x="24" y="130" width="124" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="86" y="150" font-size="12" font-weight="700" fill="#0c4a6e">1 Checkout</text>
    <text x="86" y="168">checkout scm</text>
    <text x="86" y="183">triggering commit</text>

    <rect x="161" y="130" width="124" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="223" y="150" font-size="12" font-weight="700" fill="#0c4a6e">2 Build</text>
    <text x="223" y="168">mvn clean package</text>
    <text x="223" y="183">-DskipTests → JAR</text>

    <rect x="298" y="130" width="124" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="360" y="150" font-size="12" font-weight="700" fill="#0c4a6e">3 Test</text>
    <text x="360" y="168">mvn test (unit+IT)</text>
    <text x="360" y="183">fail build on failure</text>

    <rect x="435" y="130" width="124" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="497" y="150" font-size="12" font-weight="700" fill="#0c4a6e">4 Docker Build</text>
    <text x="497" y="168">multi-stage image</text>
    <text x="497" y="183">tags :N and :latest</text>

    <rect x="572" y="130" width="124" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="634" y="150" font-size="12" font-weight="700" fill="#0c4a6e">5 Push</text>
    <text x="634" y="168">login --password-stdin</text>
    <text x="634" y="183">push :N, :latest</text>

    <rect x="709" y="130" width="127" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="772" y="150" font-size="12" font-weight="700" fill="#0c4a6e">6 Deploy</text>
    <text x="772" y="168">compose up -d</text>
    <text x="772" y="183">verify health + build N</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#a)">
    <line x1="148" y1="165" x2="159" y2="165"/>
    <line x1="285" y1="165" x2="296" y2="165"/>
    <line x1="422" y1="165" x2="433" y2="165"/>
    <line x1="559" y1="165" x2="570" y2="165"/>
    <line x1="696" y1="165" x2="707" y2="165"/>
  </g>

  <!-- Row 3: outputs -->
  <line x1="86" y1="212" x2="86" y2="250" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <rect x="12" y="252" width="176" height="66" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="100" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#422006">Email (emailext)</text>
  <text x="100" y="289" text-anchor="middle" font-size="10.2" fill="#334155">post: SUCCESS / FAILURE</text>
  <text x="100" y="304" text-anchor="middle" font-size="10.2" fill="#334155">job · build # · URL · log</text>

  <line x1="360" y1="200" x2="300" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="204" y="252" width="176" height="66" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="292" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Test reports</text>
  <text x="292" y="289" text-anchor="middle" font-size="10.2" fill="#334155">JUnit XML published</text>
  <text x="292" y="304" text-anchor="middle" font-size="10.2" fill="#334155">JaCoCo coverage archived</text>

  <line x1="634" y1="200" x2="498" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="396" y="252" width="190" height="66" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="491" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#172554">Docker Hub</text>
  <text x="491" y="289" text-anchor="middle" font-size="10.2" fill="#334155">aarpeet/calculator-api</text>
  <text x="491" y="304" text-anchor="middle" font-size="10.2" fill="#334155">tag per build · failed builds: none</text>

  <line x1="772" y1="200" x2="772" y2="232" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="600" y="234" width="248" height="152" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="612" y="251" font-size="11.5" font-weight="700" fill="#064e3b">Docker host · Compose project</text>
  <text x="612" y="265" font-size="10" fill="#334155">network calc-net (bridge)</text>

  <rect x="612" y="274" width="104" height="70" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.3"/>
  <text x="664" y="292" text-anchor="middle" font-size="11.2" font-weight="700" fill="#064e3b">nginx-proxy</text>
  <text x="664" y="308" text-anchor="middle" font-size="9.6" fill="#334155">nginx:stable-alpine</text>
  <text x="664" y="323" text-anchor="middle" font-size="9.6" fill="#334155">client → :8081</text>
  <text x="664" y="337" text-anchor="middle" font-size="9.6" fill="#334155">(container :80)</text>

  <line x1="716" y1="309" x2="730" y2="309" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="732" y="274" width="104" height="70" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.3"/>
  <text x="784" y="292" text-anchor="middle" font-size="11.2" font-weight="700" fill="#064e3b">calculator-app</text>
  <text x="784" y="308" text-anchor="middle" font-size="9.6" fill="#334155">calculator-api:N</text>
  <text x="784" y="323" text-anchor="middle" font-size="9.6" fill="#334155">direct → :8082</text>
  <text x="784" y="337" text-anchor="middle" font-size="9.6" fill="#334155">(container :8080)</text>

  <text x="724" y="362" text-anchor="middle" font-size="9.6" fill="#334155">healthchecks · restart unless-stopped</text>
  <text x="724" y="377" text-anchor="middle" font-size="9.6" fill="#334155">read-only FS · CPU/mem limits · log rotation</text>

  <text x="12" y="350" font-size="10" fill="#475569">Deploy passes only when /actuator/health = UP (:8082),</text>
  <text x="12" y="365" font-size="10" fill="#475569">add?a=2&amp;b=3 = 5 through the proxy (:8081), and /actuator/info</text>
  <text x="12" y="380" font-size="10" fill="#475569">reports build N; otherwise the stage fails with diagnostics.</text>
</svg>
