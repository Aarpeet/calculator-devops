spring.application.name=calculator-api

# Port is overridable via the SERVER_PORT environment variable (Docker / Compose)
server.port=${SERVER_PORT:8080}
# Finish in-flight requests before the container stops (clean redeploys)
server.shutdown=graceful

# ---- Actuator: expose only what the health checks need ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Render BigDecimal results in plain notation (0.0000001 instead of 1E-7)
spring.jackson.generator.write-bigdecimal-as-plain=true
