# Calculator stack: Spring Boot API + Nginx reverse proxy on a private bridge network.
#
#   docker compose up -d --build        # local build and run
#   DOCKER_IMAGE=aarpeet/calculator-api:42 docker compose up -d   # what Jenkins runs
#
# Host ports (container ports stay 8080 / 80):
#   APP_HOST_PORT   (default 8082) -> calculator-app:8080   (8080 on the host is taken by Jenkins)
#   PROXY_HOST_PORT (default 8081) -> nginx-proxy:80

# Fixed project name so a local `docker compose up` and the Jenkins Deploy stage
# manage the same stack instead of fighting over the same ports.
name: calculator-devops

services:
  calculator-app:
    image: ${DOCKER_IMAGE:-aarpeet/calculator-api:latest}
    build: .
    container_name: calculator-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
    ports:
      - "${APP_HOST_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - calc-net

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PROXY_HOST_PORT:-8081}:80"
    depends_on:
      calculator-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    name: calc-net
    driver: bridge
