worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Compress JSON responses
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json;

    # Rate limiting: 20 requests/s per client IP, bursts of up to 40 absorbed;
    # anything beyond that gets HTTP 429 instead of reaching the API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    # Docker's embedded DNS. Resolving the backend at request time (instead of
    # once at startup) means a redeploy that recreates calculator-app with a new
    # container IP never leaves Nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Security headers on every response, including errors
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Errors generated by Nginx itself get the same JSON shape as the API's
        # errors instead of an HTML page (the API's own 4xx responses pass through)
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @upstream_unavailable;

        # Liveness of the proxy itself (used by the Compose health check)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Everything else is reverse-proxied to the Spring Boot service
        location / {
            limit_req zone=api_limit burst=40 nodelay;

            set $calculator_backend http://calculator-app:8080;
            proxy_pass $calculator_backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Too many requests, please slow down","status":429,"timestamp":"$time_iso8601"}';
        }

        location @upstream_unavailable {
            default_type application/json;
            return 503 '{"error":"Calculator service is temporarily unavailable","status":503,"timestamp":"$time_iso8601"}';
        }
    }
}
