worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Resolving the backend at request time (instead of
    # once at startup) means a redeploy that recreates calculator-app with a new
    # container IP never leaves Nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Liveness of the proxy itself (used by the Compose health check)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Everything else is reverse-proxied to the Spring Boot service
        location / {
            set $calculator_backend http://calculator-app:8080;
            proxy_pass $calculator_backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
